[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanfen"
version = "0.1.0"
description = "Replay SAN chess move text and report the resulting FEN"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "jmoore306" }]

[project.scripts]
sanfen = "sanfen.cli:main"

[tool.setuptools]
packages = ["sanfen"]
